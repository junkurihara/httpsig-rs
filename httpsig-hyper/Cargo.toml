[package]
name = "httpsig-hyper"
version.workspace = true
edition.workspace = true
description = "Hyper extension for http message signatures (RFC9421)"
authors.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []

# obsolete feature gate for synchronous APIs. Kept for backward compatibility
blocking = []
rsa-signature = ["httpsig/rsa-signature"]


[dependencies]
httpsig = { path = "../httpsig", version = "0.0.27" }

thiserror = { version = "2.0.21" }
tracing = { version = "0.1.44" }
indexmap = { version = "2.14.2" }
subtle = { version = "2.6.1", default-features = false }

# content digest with rfc8941 structured field values
sha2 = { version = "0.11.0", default-features = false }
sfv = { version = "0.16.1" }

# encoding
base64 = { version = "0.23.1" }

# for request and response headers
http = { version = "1.5.0" }
http-body = { version = "1.1.0" }
http-body-util = { version = "0.1.5" }
bytes = { version = "1.12.1" }


[dev-dependencies]
futures = { version = "0.3.34", default-features = false, features = [
  "executor",
] }
tokio = { version = "1.54.1", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] } # testing only
