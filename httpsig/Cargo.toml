[package]
name = "httpsig"
version.workspace = true
edition.workspace = true
description = "Implementation of IETF RFC 9421 of http message signatures"
authors.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true
categories.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = ["tracing"]
rsa-signature = ["rsa"]
tracing = ["dep:tracing"]

[dependencies]
thiserror = { version = "2.0.21" }
tracing = { version = "0.1.44", default-features = false, optional = true }
rustc-hash = { version = "2.1.3" }
indexmap = { version = "2.14.2" }
rand = { version = "0.10.4" }

# crypto
pkcs8 = { version = "0.11.0", default-features = false, features = ["pem"] }
spki = { version = "0.8.1", default-features = false, features = ["pem"] }
sec1 = { version = "0.8.1", default-features = false, features = ["der"] }
ed25519-compact = { version = "2.6.1", default-features = false, features = [
  "random",
] }
ecdsa = { version = "0.17.0", default-features = false, features = [
  "algorithm",
] }
p256 = { version = "0.14.0", default-features = false, features = [
  "arithmetic",
  "ecdsa",
] }
p384 = { version = "0.14.0", default-features = false, features = [
  "arithmetic",
  "ecdsa",
] }
hmac = { version = "0.13.0" }
sha2 = { version = "0.11.0", default-features = false }

# rsa is optional
rsa = { version = "0.10.0", default-features = false, optional = true, features = [
  "encoding",
  "pkcs1v15",
] }

# encoding
base64 = { version = "0.23.1" }

# for rfc8941 structured field values
sfv = { version = "0.16.1" }
