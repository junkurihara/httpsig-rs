[package]
name = "httpsig"
version.workspace = true
edition.workspace = true
description = "Implementation of IETF RFC 9421 of http message signatures"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
rsa-signature = ["rsa"]

[dependencies]
thiserror = { version = "2.0.19" }
tracing = { version = "0.1.44" }
rustc-hash = { version = "2.1.3" }
indexmap = { version = "2.14.0" }
rand = { version = "0.10.2" }

# crypto
pkcs8 = { version = "0.11.0", default-features = false, features = ["pem"] }
spki = { version = "0.8.0", default-features = false, features = ["pem"] }
sec1 = { version = "0.8.1", default-features = false, features = ["der"] }
ed25519-compact = { version = "2.3.1", default-features = false, features = [
  "random",
] }
ecdsa = { version = "0.17.0", default-features = false, features = [
  "algorithm",
] }
p256 = { version = "0.14.0", default-features = false, features = [
  "arithmetic",
  "ecdsa",
] }
p384 = { version = "0.14.0", default-features = false, features = [
  "arithmetic",
  "ecdsa",
] }
hmac = { version = "0.13.0" }
sha2 = { version = "0.11.0", default-features = false }
bytes = { version = "1.12.1" }

# rsa is optional
rsa = { version = "0.10.0-rc.18", default-features = false, optional = true, features = [
  "encoding",
  "sha2",
] }

# encoding
base64 = { version = "0.22.1" }

# for rfc8941 structured field values
sfv = { version = "0.15.0" }

